<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threadmark snapshot privacy fixture</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; min-height: 100%; background: rgb(255, 255, 255); }
      .sample { position: absolute; width: 100px; height: 40px; border: 0; padding: 0; }
      #public { left: 20px; top: 20px; background: rgb(255, 214, 0); }
      #private-input { left: 20px; top: 80px; background: rgb(255, 0, 0); color: rgb(255, 255, 255); }
      #sensitive { left: 140px; top: 80px; background: rgb(0, 102, 255); }
      #ignored { left: 260px; top: 80px; background: rgb(0, 204, 102); }
      #embedded { left: 20px; top: 140px; background: rgb(255, 0, 255); }
      #painted { left: 140px; top: 140px; background: rgb(153, 51, 255); }
      #shadow-host { left: 260px; top: 140px; }
      #cross-origin { left: 380px; top: 80px; background: rgb(0, 255, 255) url("https://cross-origin.invalid/private.png"); }
      #offset-target { position: absolute; left: 170px; top: 780px; width: 160px; height: 80px; background: rgb(249, 115, 22); }
      body { min-height: 1300px; }
    </style>
  </head>
  <body>
    <div id="public" class="sample">Public content</div>
    <input id="private-input" class="sample" value="PRIVATE INPUT VALUE" />
    <div id="sensitive" class="sample" data-threadmark-sensitive>PRIVATE SENSITIVE TEXT</div>
    <div id="ignored" class="sample consumer-secret">PRIVATE CONSUMER TEXT</div>
    <iframe id="embedded" class="sample" srcdoc="<body style='margin:0;background:#ff00ff'>PRIVATE FRAME</body>"></iframe>
    <canvas id="painted" class="sample" width="100" height="40"></canvas>
    <div id="shadow-host" class="sample"></div>
    <div id="cross-origin" class="sample">External asset</div>
    <div id="offset-target">Scrolled target</div>
    <script type="module" src="./snapshot-privacy.js"></script>
  </body>
</html>
